name: CI/CD Pipeline - Recetas Service

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  IMAGE_NAME: recetas-app
  VERSION: v1.0.${{ github.run_number }}

jobs:
  security-analysis:
    name: DevSecOps - Analisis de Seguridad (Snyk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Snyk - Analisis SAST (Codigo estatico)
        run: npx snyk@1.1309.0 code test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk - Analisis SCA (Dependencias Maven)
        run: npx snyk@1.1309.0 test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  audit:
    name: Auditoria de Cumplimiento (secretos y CVE criticos)
    needs: security-analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v7

      - name: Ejecutar auditoria propia (audit/audit.sh)
        run: bash audit/audit.sh
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Subir reporte de auditoria
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-auditoria
          path: audit-report.md

  test-and-coverage:
    name: Pruebas Automatizadas y Cobertura (IE2)
    needs: audit
    runs-on: ubuntu-latest
    outputs:
      cobertura: ${{ steps.cobertura.outputs.porcentaje }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Ejecutar Pruebas Unitarias y Cobertura
        run: mvn clean verify -B

      - name: Subir Reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/

      - name: Calcular cobertura de pruebas (para el dashboard)
        id: cobertura
        run: |
          COV=$(awk -F, 'NR>1 {m+=$8; c+=$9} END {if (m+c>0) printf "%.2f", c*100/(m+c); else print 0}' target/site/jacoco/jacoco.csv)
          echo "porcentaje=$COV" >> "$GITHUB_OUTPUT"
          echo "Cobertura de lineas: ${COV}%" >> "$GITHUB_STEP_SUMMARY"

      - name: SonarQube Cloud - analisis y Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} \
            -Dsonar.qualitygate.wait=true

  docker-build:
    name: Validacion Docker Build
    needs: test-and-coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v7

      - name: Construir imagen versionada (SHA del commit + version)
        run: |
          docker build \
            --label org.opencontainers.image.revision=${GITHUB_SHA} \
            --label org.opencontainers.image.version=${VERSION} \
            --label org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY} \
            --label org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t ${IMAGE_NAME}:${GITHUB_SHA} \
            -t ${IMAGE_NAME}:${VERSION} \
            .
          docker images ${IMAGE_NAME}

      - name: Exportar imagen como artefacto (build once, deploy many)
        run: docker save ${IMAGE_NAME}:${GITHUB_SHA} ${IMAGE_NAME}:${VERSION} -o recetas-app.tar

      - name: Subir imagen versionada
        uses: actions/upload-artifact@v7
        with:
          name: recetas-image
          path: recetas-app.tar
          retention-days: 7

  deploy:
    name: Deploy Automatico (Entorno Cloud Simulado) (IE4)
    needs: [ security-analysis, audit, test-and-coverage, docker-build ]
    # Solo despliega cuando el cambio ya esta en main (despues del merge del PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: produccion-simulada
    concurrency:
      group: deploy-produccion-simulada
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v7

      - name: Descargar imagen construida y probada
        uses: actions/download-artifact@v8
        with:
          name: recetas-image

      - name: Cargar imagen versionada
        run: |
          docker load -i recetas-app.tar
          docker images ${IMAGE_NAME}

      - name: Deploy con Docker Compose (2 replicas + nginx)
        run: docker compose up -d --no-build --wait --wait-timeout 180

      - name: Verificacion post-deploy (smoke tests)
        run: |
          echo "== Health =="
          curl --fail -s http://localhost:8080/actuator/health | tee health.json
          echo
          grep -q '"status":"UP"' health.json
          echo "== API =="
          curl --fail -s -o /dev/null -w "GET /api/recetas -> HTTP %{http_code}\n" http://localhost:8080/api/recetas
          echo "== Balanceo entre replicas =="
          for i in 1 2 3 4 5 6; do
            curl -s -o /dev/null -D - http://localhost:8080/actuator/health | grep -i x-upstream
          done

      - name: Registrar trazabilidad del despliegue
        if: always()
        run: |
          mkdir -p deploy-logs
          docker compose ps > deploy-logs/compose-ps.txt
          docker compose logs --no-color > deploy-logs/compose-logs.txt
          docker inspect ${IMAGE_NAME}:${IMAGE_TAG} --format '{{json .Config.Labels}}' > deploy-logs/image-labels.json
          cat > deploy-logs/deploy-info.json << INFO
          {
            "version": "${VERSION}",
            "commit_sha": "${GITHUB_SHA}",
            "image": "${IMAGE_NAME}:${IMAGE_TAG}",
            "branch": "${GITHUB_REF_NAME}",
            "actor": "${GITHUB_ACTOR}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          INFO
          cat deploy-logs/deploy-info.json
          {
            echo "## Despliegue ${VERSION}"
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Version | \`${VERSION}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Imagen | \`${IMAGE_NAME}:${IMAGE_TAG}\` |"
            echo "| Autor | ${GITHUB_ACTOR} |"
            echo "| Entorno | produccion-simulada |"
            echo ""
            echo '```'
            cat deploy-logs/compose-ps.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir logs y metadatos del despliegue
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-logs-${{ env.VERSION }}
          path: deploy-logs/

      - name: Crear tag y release de la version desplegada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "Recetas ${VERSION}" \
            --notes "Despliegue automatico en produccion-simulada. Commit: ${GITHUB_SHA}. Imagen: ${IMAGE_NAME}:${IMAGE_TAG}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Apagar entorno simulado
        if: always()
        run: docker compose down

  deploy-eks:
    name: Deploy a Kubernetes en AWS EKS (EP3)
    # Solo llega aqui lo que paso TODAS las puertas anteriores, y requiere aprobacion de un revisor
    needs: [ test-and-coverage, deploy ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: produccion-eks
    concurrency:
      group: deploy-eks
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

    steps:
      - name: Registrar inicio del despliegue
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout del codigo
        uses: actions/checkout@v7

      - name: Validar credenciales AWS (sesion de Learner Lab activa)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          if ! aws sts get-caller-identity --region "$AWS_REGION" > /dev/null; then
            echo "::error::Credenciales AWS vencidas. Inicia el Learner Lab y actualiza los secrets AWS_*."
            exit 1
          fi

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Descargar la imagen construida y probada
        uses: actions/download-artifact@v8
        with:
          name: recetas-image

      - name: Publicar imagen en Amazon ECR
        run: |
          docker load -i recetas-app.tar
          aws ecr describe-repositories --repository-names "$IMAGE_NAME" > /dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$IMAGE_NAME" > /dev/null
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "IMAGE=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Conectar kubectl al cluster EKS
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
          kubectl get nodes

      - name: Desplegar microservicio (kubectl apply)
        run: |
          for f in k8s/*.yaml; do
            sed -e "s|__IMAGE__|$IMAGE|g" -e "s|__VERSION__|$VERSION|g" -e "s|__COMMIT_SHA__|$GITHUB_SHA|g" "$f" | kubectl apply -f -
          done
          kubectl rollout status deployment/recetas-svc -n recetas --timeout=300s
          kubectl rollout history deployment/recetas-svc -n recetas

      - name: Verificacion post-deploy
        run: |
          for i in $(seq 1 30); do
            HOST=$(kubectl get svc recetas-svc -n recetas -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            [ -n "$HOST" ] && curl -fsS -m 5 "http://$HOST/actuator/health" | grep -q '"status":"UP"' && break
            echo "Esperando el Load Balancer ($i)..."; sleep 10
          done
          curl -fsS -m 5 "http://$HOST/actuator/health" | grep -q '"status":"UP"'
          echo "APP_URL=http://$HOST" >> "$GITHUB_ENV"
          # El nombre del Load Balancer es la primera parte de su DNS (lo usan las metricas AWS/ELB)
          echo "ELB_NAME=${HOST%%-*}" >> "$GITHUB_ENV"

      - name: Configurar observabilidad en CloudWatch (alarmas, SNS y dashboard)
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: bash monitoring/configurar-cloudwatch.sh

      - name: Publicar cobertura y tiempo de despliegue en CloudWatch
        env:
          COBERTURA: ${{ needs.test-and-coverage.outputs.cobertura }}
        run: |
          DURACION=$(( $(date +%s) - INICIO ))
          aws cloudwatch put-metric-data --namespace Recetas/CICD --metric-name CoberturaPruebas \
            --dimensions Servicio=recetas-svc --unit Percent --value "${COBERTURA:-0}"
          aws cloudwatch put-metric-data --namespace Recetas/CICD --metric-name TiempoDespliegue \
            --dimensions Servicio=recetas-svc --unit Seconds --value "$DURACION"
          echo "Cobertura: ${COBERTURA}% | Tiempo de despliegue: ${DURACION}s"

      - name: Resumen y logs del despliegue
        if: always()
        run: |
          mkdir -p logs-eks
          kubectl get pods -n recetas -o wide > logs-eks/pods.txt 2>&1 || true
          kubectl logs -n recetas -l app=recetas-svc --tail=300 --prefix > logs-eks/recetas-svc.log 2>&1 || true
          {
            echo "## Despliegue EKS ${VERSION}"
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Imagen | \`${IMAGE:-n/a}\` |"
            echo "| Microservicio | ${APP_URL:-n/a} |"
            echo "| Dashboard | CloudWatch > Paneles > Recetas-DevOps |"
            echo ""
            echo '```'
            cat logs-eks/pods.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir logs del despliegue
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-eks-${{ env.VERSION }}
          path: logs-eks/

name: CI/CD Pipeline - Recetas Service

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-analysis:
    name: DevSecOps - Analisis de Seguridad (Snyk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Snyk - Analisis SAST (Codigo estatico)
        run: npx snyk code test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk - Analisis SCA (Dependencias Maven)
        run: npx snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  test-and-coverage:
    name: Pruebas Automatizadas y Cobertura (IE2)
    needs: security-analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Ejecutar Pruebas Unitarias y Cobertura (>= 70%)
        run: mvn clean verify -B

      - name: Subir Reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/

  docker-build:
    name: Validacion Docker Build
    needs: test-and-coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Validar construccion de la imagen Docker
        run: docker build -t recetas-app:test .

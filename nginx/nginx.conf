events {}

http {
    # Docker resuelve "recetas-svc" a la IP de cada replica -> balanceo round-robin
    upstream recetas_backend {
        server recetas-svc:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://recetas_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Muestra que replica respondio (evidencia de balanceo)
            add_header X-Upstream $upstream_addr always;
        }
    }
}

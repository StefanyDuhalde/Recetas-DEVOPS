services:
  recetas-svc:
    build: .
    image: duoc/jv0101-caso07-recetas:1.0.0
    container_name: caso07-recetas-svc
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
